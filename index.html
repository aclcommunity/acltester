<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ACL Compiler Web Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/ui/monaco-editor.min.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        header { background: #1e1e1e; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo { font-size: 1.2rem; font-weight: bold; color: #00ff66; }
        button { background: #238636; color: white; border: none; padding: 8px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:disabled { background: #555; cursor: not-allowed; }
        .main { display: flex; flex: 1; height: calc(100vh - 60px); }
        #editor { width: 60%; height: 100%; border-right: 2px solid #222; }
        .terminal { width: 40%; background: #080808; display: flex; flex-direction: column; }
        .term-header { background: #181818; padding: 8px 15px; font-size: 0.9rem; color: #888; border-bottom: 1px solid #222; }
        #output { padding: 15px; color: #00ff66; white-space: pre-wrap; font-family: 'Courier New', monospace; flex: 1; overflow-y: auto; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ ACL Web Studio</div>
        <button id="run-btn" onclick="runACL()" disabled>Loading Compiler Engine...</button>
    </header>

    <div class="main">
        <div id="editor"></div>
        <div class="terminal">
            <div class="term-header">ACL Terminal Output</div>
            <div id="output">Initializing WebAssembly Engine...</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <script>
        let editor;
        let pyodide;

        async function initEngine() {
            try {
                pyodide = await loadPyodide();
                
                // Fetch compiler.py and ALL highlevel modules
                const compilerCode = await fetch('./compiler.py').then(r => r.text());
                const tokensCode = await fetch('./highlevel/tokens.py').then(r => r.text());
                const astNodesCode = await fetch('./highlevel/ast_nodes.py').then(r => r.text());
                const lexerCode = await fetch('./highlevel/lexer.py').then(r => r.text());
                const parserCode = await fetch('./highlevel/parser.py').then(r => r.text());
                const semanticCode = await fetch('./highlevel/semantic.py').then(r => r.text());
                const codegenCode = await fetch('./highlevel/codegen.py').then(r => r.text());

                // Mount complete module tree into Pyodide VFS
                await pyodide.runPythonAsync(`
import os
import sys

# Add highlevel folder to Python Search Path so internal imports like "from tokens import ..." work smoothly
os.makedirs('highlevel', exist_ok=True)
if os.path.abspath('highlevel') not in sys.path:
    sys.path.append(os.path.abspath('highlevel'))

with open('compiler.py', 'w') as f:
    f.write('''${compilerCode.replace(/\\/g, '\\\\').replace(/'''/g, "\\'\\'\\'") }''')

with open('highlevel/tokens.py', 'w') as f:
    f.write('''${tokensCode.replace(/\\/g, '\\\\').replace(/'''/g, "\\'\\'\\'") }''')

with open('highlevel/ast_nodes.py', 'w') as f:
    f.write('''${astNodesCode.replace(/\\/g, '\\\\').replace(/'''/g, "\\'\\'\\'") }''')

with open('highlevel/lexer.py', 'w') as f:
    f.write('''${lexerCode.replace(/\\/g, '\\\\').replace(/'''/g, "\\'\\'\\'") }''')

with open('highlevel/parser.py', 'w') as f:
    f.write('''${parserCode.replace(/\\/g, '\\\\').replace(/'''/g, "\\'\\'\\'") }''')

with open('highlevel/semantic.py', 'w') as f:
    f.write('''${semanticCode.replace(/\\/g, '\\\\').replace(/'''/g, "\\'\\'\\'") }''')

with open('highlevel/codegen.py', 'w') as f:
    f.write('''${codegenCode.replace(/\\/g, '\\\\').replace(/'''/g, "\\'\\'\\'") }''')

from highlevel.lexer import HighLexer
from highlevel.parser import HighParser
from highlevel.semantic import HighSemanticAnalyzer

def run_browser_code(code):
    try:
        lexer = HighLexer(code, filename="test.acl")
        tokens = lexer.tokenize()
        parser = HighParser(tokens, filename="test.acl")
        ast = parser.parse()
        
        analyzer = HighSemanticAnalyzer(filename="test.acl")
        if not analyzer.analyze(ast):
            return "\\n".join(analyzer.errors)
            
        return "SUCCESS: High-Level Code Parsed & Verified Successfully! (AST Ready)"
    except Exception as e:
        return f"Syntax/Compiler Error: {str(e)}"
                `);

                document.getElementById('output').innerText = "ACL High-Level Engine Loaded & Ready!";
                const btn = document.getElementById('run-btn');
                btn.innerText = "Run Code (Ctrl + Enter)";
                btn.disabled = false;
            } catch (err) {
                document.getElementById('output').innerText = "Engine Load Error: " + err.message;
            }
        }

        initEngine();

        // Monaco Editor Config
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            monaco.languages.register({ id: 'acl' });
            monaco.languages.setMonarchTokensProvider('acl', {
                tokenizer: {
                    root: [
                        [/set|say|check|loop_if|block|call|ret|try|catch|raise/, "keyword"],
                        [/\".*?\"/, "string"],
                        [/#.*/, "comment"],
                        [/[0-9]+/, "number"]
                    ]
                }
            });

            editor = monaco.editor.create(document.getElementById('editor'), {
                value: `@mode: high\n\nset name = "aryan"\nsay "Hello " + name\n\nset a = 10\nset b = 20\nset sum = a + b\nsay sum`,
                language: 'acl',
                theme: 'vs-dark',
                fontSize: 15,
                automaticLayout: true
            });

            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runACL);
        });

        async function runACL() {
            const code = editor.getValue();
            const outDiv = document.getElementById('output');
            outDiv.innerText = "Compiling with ACL High-Level Engine...";

            try {
                pyodide.globals.set("user_code", code);
                const result = await pyodide.runPythonAsync(`run_browser_code(user_code)`);
                outDiv.innerText = result;
            } catch (err) {
                outDiv.innerText = "Execution Error: " + err.message;
            }
        }
    </script>
</body>
</html>
