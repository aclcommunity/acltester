<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACL Compiler Web Studio (Pure JS Engine)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/ui/monaco-editor.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        header { background: #1e1e1e; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo { font-size: 1.2rem; font-weight: bold; color: #00ff66; }
        button { background: #238636; color: white; border: none; padding: 8px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .main { display: flex; flex: 1; height: calc(100vh - 60px); }
        #editor { width: 60%; height: 100%; border-right: 2px solid #222; }
        .terminal { width: 40%; background: #080808; display: flex; flex-direction: column; }
        .term-header { background: #181818; padding: 8px 15px; font-size: 0.9rem; color: #888; border-bottom: 1px solid #222; }
        #output { padding: 15px; color: #00ff66; white-space: pre-wrap; font-family: 'Courier New', monospace; flex: 1; overflow-y: auto; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ ACL Web Studio (Pure JS Interpreter)</div>
        <button id="run-btn" onclick="runACL()">Run Code (Ctrl + Enter)</button>
    </header>

    <div class="main">
        <div id="editor"></div>
        <div class="terminal">
            <div class="term-header">ACL Terminal Output</div>
            <div id="output">Engine Ready!</div>
        </div>
    </div>

    <script>
        let editor;

        // Monaco Editor Setup
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            monaco.languages.register({ id: 'acl' });
            monaco.languages.setMonarchTokensProvider('acl', {
                tokenizer: {
                    root: [
                        [/set|say/, "keyword"],
                        [/\".*?\"/, "string"],
                        [/#.*/, "comment"],
                        [/[0-9]+/, "number"]
                    ]
                }
            });

            editor = monaco.editor.create(document.getElementById('editor'), {
                value: `@high\n\nsay "hi"\n\nset name = "aryan"\nsay name + " is great"\n\nset a = 5\nset b = 10\nsay a + b\nsay a * b\nsay b / a`,
                language: 'acl',
                theme: 'vs-dark',
                fontSize: 15,
                automaticLayout: true
            });

            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runACL);
        });

        // Safe Expression Evaluator using JS Scope
        function evaluateExpression(expr, env) {
            try {
                // Replace variables in expression with their values in scope
                const keys = Object.keys(env);
                const values = Object.values(env);
                
                // Construct safe function scope
                const func = new Function(...keys, `return (${expr});`);
                return func(...values);
            } catch (err) {
                throw new Error(`Expression evaluation error: ${expr}`);
            }
        }

        // Pure JS ACL Interpreter Engine
        function runACL() {
            if (!editor) return;
            const code = editor.getValue();
            const outDiv = document.getElementById('output');
            outDiv.innerText = "";

            const lines = code.split('\n');
            const env = {};
            const output = [];

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                // Ignore empty lines, comments and directives
                if (!line || line.startsWith('#') || line.startsWith('@')) {
                    continue;
                }

                try {
                    // 1. SET Statement (e.g., set name = "aryan" or set a = 5 + 10)
                    if (line.startsWith('set ')) {
                        const statement = line.substring(4).trim();
                        const parts = statement.split('=');

                        if (parts.length >= 2) {
                            const varName = parts[0].trim();
                            const expr = parts.slice(1).join('=').trim();
                            
                            // Evaluate and store in environment
                            env[varName] = evaluateExpression(expr, env);
                        } else {
                            throw new Error(`Line ${i + 1}: Invalid set syntax`);
                        }
                    } 
                    // 2. SAY Statement (e.g., say "hi" or say name + " is great")
                    else if (line.startsWith('say ')) {
                        const expr = line.substring(4).trim();
                        const result = evaluateExpression(expr, env);
                        output.push(result);
                    }
                } catch (err) {
                    outDiv.innerText = `Runtime Error on Line ${i + 1}: ${err.message}`;
                    return;
                }
            }

            outDiv.innerText = output.length > 0 ? output.join('\n') : "Program executed with no output.";
        }
    </script>
</body>
</html>
